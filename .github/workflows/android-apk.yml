# Android programėlė (kainų skaičiuoklė): surenka APK iš aplanko android/.
# Programėlė rodo https://stiklutamsinimas.eu/skaiciuokle, todėl kainos atsinaujina be naujos versijos –
# APK perkurti reikia tik pakeitus android/ kodą (padidinkite versionCode faile android/app/build.gradle).
#
# Jei GitHub Secrets nustatytas parašo raktas (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD),
# pasirašytas APK automatiškai įdedamas į public/programele/ ir svetainė jį siūlo atsisiųsti.
# Be rakto surenkamas nepasirašytas APK į šaką „android-nepasirasytas“ (pasirašyti rankiniu būdu).
name: Android programėlė (APK)

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Parašo raktas
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Raktas yra – APK bus pasirašytas."
          else
            echo "Rakto nėra – bus surinktas nepasirašytas APK."
          fi

      - name: Surinkti APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Versija
        working-directory: android
        run: |
          VC=$(grep -E '^\s*versionCode\s*=' app/build.gradle | grep -oE '[0-9]+' | head -1)
          VN=$(grep -E '^\s*versionName\s*=' app/build.gradle | grep -oE "'[^']+'" | tr -d "'" | head -1)
          echo "VC=$VC" >> "$GITHUB_ENV"
          echo "VN=$VN" >> "$GITHUB_ENV"
          ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: stiklutamsinimas-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Įdėti pasirašytą APK į svetainę
        if: env.KEYSTORE_FILE != ''
        run: |
          mkdir -p public/programele
          cp android/app/build/outputs/apk/release/app-release.apk public/programele/stiklutamsinimas.apk
          printf '{\n  "versionCode": %s,\n  "versionName": "%s"\n}\n' "$VC" "$VN" > public/programele/versija.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/programele
          git diff --cached --quiet && { echo "APK nepasikeitė."; exit 0; }
          git commit -m "Android programėlė $VN (versija $VC)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Nepasirašytas APK į atskirą šaką
        if: env.KEYSTORE_FILE == ''
        run: |
          D="$RUNNER_TEMP/nepasirasytas"
          mkdir -p "$D"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$D/app-release-unsigned.apk"
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "commit": "%s",\n  "branch": "%s"\n}\n' "$VC" "$VN" "$GITHUB_SHA" "$GITHUB_REF_NAME" > "$D/versija.json"
          cd "$D"
          git init -q -b android-nepasirasytas
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Nepasirašytas APK $VN ($VC) iš $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:android-nepasirasytas
