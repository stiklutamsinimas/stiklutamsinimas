# Sveltia CMS nustatymai – straipsnių ir parduotuvės prekių redagavimas per naršyklę: https://stiklutamsinimas.eu/admin
# Prisijungimas: mygtukas „Sign In with GitHub“ (žr. docs/admin-prisijungimas.md). Atsarginis būdas – „Sign In Using Access Token“.
# Išsaugojus straipsnį, jis įrašomas į GitHub, o Cloudflare per ~2 min. atnaujina svetainę.

backend:
  name: github
  repo: stiklutamsinimas/stiklutamsinimas
  branch: main
  # Prisijungimas su GitHub per šios svetainės /api/auth (functions/api/auth.ts, callback.ts)
  base_url: https://stiklutamsinimas.eu
  auth_endpoint: api/auth
  commit_messages:
    create: 'Naujas įrašas ({{collection}}): {{slug}}'
    update: 'Atnaujinta ({{collection}}): {{slug}}'
    delete: 'Ištrinta ({{collection}}): {{slug}}'
    uploadMedia: 'Įkelta nuotrauka: {{path}}'
    deleteMedia: 'Ištrinta nuotrauka: {{path}}'

site_url: https://stiklutamsinimas.eu
display_url: https://stiklutamsinimas.eu
logo_url: /icon-192.png

# Nuotraukos saugomos šalia kitų svetainės nuotraukų ir automatiškai optimizuojamos
media_folder: src/assets/naujienos
public_folder: /src/assets/naujienos

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: naujienos
    label: Naujienos (straipsniai)
    label_singular: Straipsnis
    description: Straipsnio adresas sudaromas iš pavadinimo (pvz. /kaip-priziureti-tamsintus-stiklus). Pažymėjus „Juodraštis“ straipsnis svetainėje nerodomas.
    folder: src/content/naujienos
    # Nuotraukų kelias straipsnyje – santykinis (../../assets/naujienos/...), kad Astro jas optimizuotų
    media_folder: ../../assets/naujienos
    public_folder: ../../assets/naujienos
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{title}}'
    summary: '{{title}}'
    sortable_fields: [pubDate, title]
    preview_path: '{{slug}}'
    fields:
      - label: Pavadinimas
        name: title
        widget: string
        hint: Aiškus pavadinimas su raktažodžiais, pvz. „Kaip prižiūrėti tamsintus stiklus“. 5–120 simbolių.
        pattern: ['^.{5,120}$', 'Pavadinimas turi būti nuo 5 iki 120 simbolių']
      - label: Trumpas aprašymas
        name: description
        widget: text
        hint: Rodomas Google paieškoje ir straipsnio kortelėje. Geriausia 120–160 simbolių (leidžiama 40–320).
        pattern: ['^[\s\S]{40,320}$', 'Aprašymas turi būti nuo 40 iki 320 simbolių']
      - label: Paskelbimo data
        name: pubDate
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
      - label: Viršelio nuotrauka
        name: cover
        widget: image
        required: false
        hint: Horizontali nuotrauka (pvz. 1600×900). Be automobilių numerių.
      - label: Nuotraukos aprašymas
        name: coverAlt
        widget: string
        required: false
        hint: Kas nuotraukoje – svarbu Google ir neregiams, pvz. „Audi Q7 su tamsintais galiniais stiklais“.
      - label: SEO pavadinimas (nebūtina)
        name: seoTitle
        widget: string
        required: false
        hint: Jei norite kitokio pavadinimo Google paieškai. Iki 70 simbolių.
        pattern: ['^.{0,70}$', 'Iki 70 simbolių']
      - label: Žymos
        name: tags
        widget: list
        required: false
        default: []
        hint: Pvz. Automobiliams, Patarimai, Plėvelės
      - label: Atnaujinta (nebūtina)
        name: updatedDate
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        required: false
      - label: Juodraštis (nerodomas svetainėje)
        name: draft
        widget: boolean
        default: false
      - label: Tekstas
        name: body
        widget: markdown
        hint: Naudokite antraštes (H2, H3), sąrašus ir nuorodas į paslaugas, pvz. /automobilio-stiklu-tamsinimas

  - name: produktai
    label: 'Parduotuvė – prekės'
    label_singular: 'Prekė'
    description: 'Prekės adresas sudaromas iš pavadinimo (pvz. /parduotuve/pleveles/saules-kontroles-plevele). Pažymėjus „Juodraštis“ prekė svetainėje nerodoma. Prekes iš AliExpress, Alibaba, Temu, eBay ir Amazon greičiausia kelti per stiklutamsinimas.eu/admin/importas'
    folder: src/content/produktai
    # Nuotraukų kelias – santykinis (../../assets/produktai/...), kad Astro jas optimizuotų
    media_folder: ../../assets/produktai
    public_folder: ../../assets/produktai
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{title}}'
    summary: '{{title}} – {{price}} €'
    sortable_fields: [title, price, order]
    view_filters:
      - { label: 'Plėvelės', field: category, pattern: pleveles }
      - { label: 'Įrankiai', field: category, pattern: irankiai }
      - { label: 'Juodraščiai', field: draft, pattern: true }
    fields:
      - label: 'Pavadinimas'
        name: title
        widget: string
        hint: 'Pvz. „Saulės kontrolės plėvelė Silver 20“ arba „Mentelė plėvelėms klijuoti“. 3–100 simbolių.'
        pattern: ['^.{3,100}$', 'Pavadinimas turi būti nuo 3 iki 100 simbolių']
      - label: 'Kategorija'
        name: category
        widget: select
        options:
          - { label: 'Plėvelės', value: pleveles }
          - { label: 'Įrankiai', value: irankiai }
      - label: 'Kaina, €'
        name: price
        widget: number
        value_type: float
        min: 0
        step: 0.01
        hint: 'Galutinė kaina pirkėjui. Jei variantų kainos skiriasi – įrašykite mažiausią.'
      - label: 'Sena kaina, € (akcijai, nebūtina)'
        name: oldPrice
        widget: number
        value_type: float
        min: 0
        step: 0.01
        required: false
        hint: 'Rodoma perbraukta šalia kainos.'
      - label: 'Matavimo vienetas'
        name: unit
        widget: select
        default: 'vnt.'
        options: ['vnt.', 'm', 'm²', 'ritinys', 'komplektas']
        hint: 'Plėvelėms metrais – „m“ (kaina už 1 metrą).'
      - label: 'Mažiausias kiekis'
        name: minQty
        widget: number
        value_type: int
        min: 1
        default: 1
      - label: 'Turime sandėlyje'
        name: inStock
        widget: boolean
        default: true
      - label: 'Nuotraukos'
        name: images
        widget: list
        min: 1
        field: { label: 'Nuotrauka', name: image, widget: image }
        hint: 'Pirma nuotrauka – pagrindinė. Geriausia kvadratinės (pvz. 1200×1200).'
      - label: 'Nuotraukos aprašymas (nebūtina)'
        name: imageAlt
        widget: string
        required: false
        hint: 'Kas nuotraukoje – svarbu Google ir neregiams.'
      - label: 'Trumpas aprašymas'
        name: description
        widget: text
        hint: 'Rodomas prekės viršuje ir Google paieškoje. 20–320 simbolių.'
        pattern: ['^[\s\S]{20,320}$', 'Aprašymas turi būti nuo 20 iki 320 simbolių']
      - label: 'Variantų pavadinimas'
        name: variantLabel
        widget: string
        required: false
        default: 'Variantas'
        hint: 'Pvz. „Tamsumas“, „Plotis“, „Spalva“. Rodomas virš pasirinkimo.'
      - label: 'Variantai (nebūtina)'
        name: variants
        widget: list
        required: false
        summary: '{{fields.name}}'
        hint: 'Pvz. 5 %, 15 %, 35 % arba 76 cm, 152 cm. Jei kaina nenurodyta – imama pagrindinė.'
        fields:
          - { label: 'Pavadinimas', name: name, widget: string }
          - { label: 'Kaina, € (jei kitokia)', name: price, widget: number, value_type: float, min: 0, step: 0.01, required: false }
          - { label: 'Turime', name: inStock, widget: boolean, default: true }
      - label: 'Techniniai duomenys (nebūtina)'
        name: specs
        widget: list
        required: false
        summary: '{{fields.label}}: {{fields.value}}'
        hint: 'Pvz. „Šviesos pralaidumas“ – „35 %“, „Plotis“ – „152 cm“, „Garantija“ – „5 metai“.'
        fields:
          - { label: 'Savybė', name: label, widget: string }
          - { label: 'Reikšmė', name: value, widget: string }
      - { label: 'Gamintojas (nebūtina)', name: brand, widget: string, required: false }
      - { label: 'Prekės kodas (nebūtina)', name: sku, widget: string, required: false }
      - { label: 'Populiari prekė (rodyti pirmiau)', name: featured, widget: boolean, default: false }
      - label: 'Eiliškumas'
        name: order
        widget: number
        value_type: int
        default: 100
        hint: 'Mažesnis skaičius – rodoma pirmiau.'
      - { label: 'Juodraštis (nerodoma svetainėje)', name: draft, widget: boolean, default: false }
      - label: 'Tiekėjo nuoroda (nerodoma pirkėjams)'
        name: source
        widget: string
        required: false
        hint: 'Kur užsakyti prekę, kai ją nuperka klientas (AliExpress, Temu ir pan.).'
      - label: 'Siunčiama tiesiai iš tiekėjo (dropshipping)'
        name: dropship
        widget: boolean
        required: false
        hint: 'Įjungta – krepšelyje šiai prekei siūlomas tik pristatymas iš tiekėjo (žr. Nustatymai → Parduotuvė → „Pristatymas iš tiekėjo“). Jei laukas nenustatytas – įjungta, kai įrašyta tiekėjo nuoroda.'
      - { label: 'Tiekėjo kaina (nerodoma pirkėjams)', name: sourcePrice, widget: number, value_type: float, min: 0, step: 0.01, required: false }
      - { label: 'Tiekėjo kainos valiuta', name: sourceCurrency, widget: string, required: false, hint: 'Pvz. EUR, USD' }
      - label: 'Išsamus aprašymas'
        name: body
        widget: markdown
        hint: 'Kam tinka, kaip naudoti, kuo ypatinga. Galite naudoti antraštes ir sąrašus.'

  - name: nustatymai
    label: Nustatymai
    description: Google atsiliepimai ir parduotuvės nustatymai (pristatymas, apmokėjimas, rekvizitai).
    files:
      - name: atsiliepimai
        label: Google atsiliepimai
        file: src/data/atsiliepimai.json
        format: json
        fields:
          - label: Vidutinis įvertinimas (pvz. 5 arba 4.9)
            name: rating
            widget: number
            value_type: float
            min: 1
            max: 5
          - label: Atsiliepimų skaičius Google
            name: count
            widget: number
            value_type: int
            min: 0
          - label: Ką klientai dažniausiai mini
            name: highlights
            widget: list
            default: []
          - label: Nuoroda „Palikti atsiliepimą“ (nebūtina)
            name: writeReviewUrl
            widget: string
            required: false
            hint: Google verslo profilyje → „Prašyti atsiliepimų“ → nukopijuokite nuorodą (pvz. https://g.page/r/.../review)
          - label: Atsiliepimai
            name: reviews
            widget: list
            summary: '{{fields.author}} – {{fields.text}}'
            fields:
              - { label: Vardas (pvz. Žilvinas S.), name: author, widget: string }
              - { label: Įvertinimas, name: rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }
              - { label: Tekstas, name: text, widget: text }
      - name: parduotuve
        label: 'Parduotuvė – pristatymas, apmokėjimas, rekvizitai'
        file: src/data/parduotuve.json
        format: json
        fields:
          - label: 'Pristatymo būdai'
            name: delivery
            widget: list
            summary: '{{fields.name}} – {{fields.price}} €'
            fields:
              - { label: 'Pavadinimas', name: name, widget: string, hint: 'Pvz. „Į paštomatą (LP Express, Omniva, DPD)“' }
              - label: 'Tipas'
                name: type
                widget: select
                options:
                  - { label: 'Atsiėmimas dirbtuvėse', value: atsiemimas }
                  - { label: 'Paštomatas', value: pastomatas }
                  - { label: 'Kurjeris į adresą', value: kurjeris }
              - { label: 'Kaina, €', name: price, widget: number, value_type: float, min: 0, step: 0.01, default: 0 }
              - { label: 'Pastaba (nebūtina)', name: note, widget: string, required: false }
          - label: 'Pristatymas iš tiekėjo (dropshipping prekėms)'
            name: dropship
            widget: object
            hint: 'Kai krepšelyje yra prekė, siunčiama tiesiai iš tiekėjo (AliExpress ir pan.), pirkėjui siūlomas tik šis pristatymo būdas – į namų adresą. Nurodykite tikrą terminą.'
            fields:
              - { label: 'Pavadinimas', name: name, widget: string, default: 'Pristatymas į namus iš tiekėjo sandėlio' }
              - { label: 'Kaina, €', name: price, widget: number, value_type: float, min: 0, step: 0.01, default: 0 }
              - { label: 'Pristatymo terminas / pastaba', name: note, widget: string, default: 'Pristatymas per 10–20 darbo dienų.' }
          - label: 'Nemokamas pristatymas nuo, € (0 – išjungta)'
            name: freeShippingFrom
            widget: number
            value_type: float
            min: 0
            default: 0
          - { label: 'Leisti apmokėti atsiimant', name: payOnPickup, widget: boolean, default: true }
          - label: 'Banko rekvizitai (pavedimams)'
            name: bank
            widget: object
            hint: 'Užpildžius pirkėjas rekvizitus pamatys iškart po užsakymo. Jei tuščia – rašoma, kad sąskaitą atsiųsite el. paštu.'
            fields:
              - { label: 'Gavėjas', name: receiver, widget: string, required: false }
              - { label: 'Sąskaita (IBAN)', name: iban, widget: string, required: false }
              - { label: 'Bankas', name: bank, widget: string, required: false }
          - label: 'Pardavėjo rekvizitai (pirkimo taisyklėms)'
            name: seller
            widget: object
            hint: 'Įstatymas reikalauja nurodyti pardavėją. Užpildykite prieš paskelbdami pirmą prekę.'
            fields:
              - { label: 'Pavadinimas (įmonė arba vardas ir pavardė)', name: name, widget: string, required: false }
              - { label: 'Įmonės kodas arba individualios veiklos pažymos nr.', name: code, widget: string, required: false }
              - { label: 'PVM mokėtojo kodas (jei yra)', name: vatCode, widget: string, required: false }
              - { label: 'Adresas', name: address, widget: string, required: false }
