plugins {
    id 'com.android.application'
}

// Parašo raktas paduodamas per aplinkos kintamuosius (GitHub Secrets),
// todėl slaptažodžiai niekada nepatenka į kodą.
def keystoreFile = System.getenv('KEYSTORE_FILE')

android {
    namespace = 'eu.stiklutamsinimas.kainos'
    compileSdk = 36

    defaultConfig {
        applicationId = 'eu.stiklutamsinimas.kainos'
        minSdk = 24
        targetSdk = 35
        // Didinkite versionCode tik keisdami pačią programėlę (ne kainas!).
        // Kainos atsinaujina automatiškai iš svetainės.
        versionCode = 1
        versionName = '1.0'

        // Adresas, kurį atidaro programėlė
        buildConfigField 'String', 'APP_URL', '"https://stiklutamsinimas.eu/skaiciuokle"'
        buildConfigField 'String', 'APP_HOST', '"stiklutamsinimas.eu"'
    }

    buildFeatures {
        buildConfig = true
    }

    signingConfigs {
        release {
            if (keystoreFile) {
                storeFile = file(keystoreFile)
                storePassword = System.getenv('KEYSTORE_PASSWORD')
                keyAlias = System.getenv('KEY_ALIAS')
                keyPassword = System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            if (keystoreFile) {
                signingConfig = signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
